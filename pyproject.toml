[project]
name = "tinytask"
version = "0.3.0"
description = "A tiny command-line to-do list that keeps your tasks in one JSON file."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
tinytask = "tinytask.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["tinytask"]

[tool.pytest.ini_options]
testpaths = ["tests"]
